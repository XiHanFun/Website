allowBuilds:
  esbuild: true

# 依赖目录（单一版本事实源）：package.json 一律用 catalog: 引用，升级只改这里一处
catalog:
  '@vitejs/plugin-vue': ^5.2.4
  '@xihan-ui/animations': 3.0.0
  '@xihan-ui/code-highlight': 3.0.0
  '@xihan-ui/icons': 3.0.0
  '@xihan-ui/styles': 3.0.0
  '@xihan-ui/tokens': 3.0.0
  '@xihan-ui/vue': 3.0.0
  typescript: ^5.9.3
  vite: ^6.4.1
  vue: ^3.5.30
  vue-router: ^4.5.1
  vue-tsc: ^2.2.12

# @xihan-ui/* 写精确版本；这里把它们排除在最短发布时长门槛之外。
# 兄弟包（core / headless / motion / pointer / position / viz）是传递依赖，装得到但不直接引。
minimumReleaseAgeExclude:
  - '@xihan-ui/animations@3.0.0'
  - '@xihan-ui/code-highlight@3.0.0'
  - '@xihan-ui/core@3.0.0'
  - '@xihan-ui/headless@3.0.0'
  - '@xihan-ui/icons@3.0.0'
  - '@xihan-ui/motion@3.0.0'
  - '@xihan-ui/pointer@3.0.0'
  - '@xihan-ui/position@3.0.0'
  - '@xihan-ui/styles@3.0.0'
  - '@xihan-ui/tokens@3.0.0'
  - '@xihan-ui/viz@3.0.0'
  - '@xihan-ui/vue@3.0.0'
